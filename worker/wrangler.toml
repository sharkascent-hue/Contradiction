# Deploy with:  cd worker && npx wrangler deploy   then   npx wrangler secret put ANTHROPIC_API_KEY
name = "contradiction-ai"
main = "index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
SITE_URL = "https://raw.githubusercontent.com/sharkascent-hue/Contradiction/main/"
ALLOWED_ORIGIN = "https://sharkascent-hue.github.io,https://contradictionai.com,https://www.contradictionai.com,http://contradictionai.com,http://www.contradictionai.com"

# Rate limits shared by every instance (Cloudflare Workers rate limiting).
[[unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RL_ALL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 40, period = 60 }
